<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>ริมหีโต๊ะไพ่ (ฉบับคนจังไร) - 80s Classic Edition</title>
<meta name="theme-color" content="#ff71ce" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --primary: #2d1b4d;
  --secondary: #ff71ce;
  --accent: #01cdfe;
  --accent-gold: #fffb96;
  --accent-purple: #b967ff;
  --bg-dark: #05010d;
  --text-light: #ffffff;
  --glass: rgba(255, 255, 255, 0.1);
  --glass-dark: rgba(0, 0, 0, 0.5);
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

body {
  margin: 0; padding: 0; height: 100%;
  background-color: var(--bg-dark);
  color: var(--text-light);
  font-family: 'Mitr', sans-serif;
  overflow-x: hidden;
  user-select: none;
  /* Retro Grid Background */
  background-image: 
    linear-gradient(rgba(45, 27, 77, 0.8), rgba(5, 1, 13, 0.9)),
    linear-gradient(var(--glass) 1px, transparent 1px),
    linear-gradient(90deg, var(--glass) 1px, transparent 1px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
}

.app-shell {
  max-width: 500px; margin: 0 auto; min-height: 100vh;
  position: relative;
  background: rgba(5, 1, 13, 0.7);
  border-left: 1px solid var(--secondary);
  border-right: 1px solid var(--secondary);
}

.hidden { display: none !important; }
.view { display: none; padding: 20px; }
.view.active { display: block; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Hero Section with Anime Girl */
.hero-box {
  width: 100%;
  height: 250px;
  background-size: cover;
  background-position: center;
  border-radius: 0 0 var(--radius) var(--radius);
  border-bottom: 4px solid var(--secondary);
  position: relative;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(255, 113, 206, 0.3);
}

.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(transparent, var(--bg-dark));
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 20px; text-align: center;
}

.logo-title {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem; font-weight: 900; margin: 0;
  color: #fff;
  text-shadow: 3px 3px 0 var(--secondary), -1px -1px 0 var(--accent);
  letter-spacing: -1px;
}

.panel {
  background: var(--glass-dark);
  border: 1px solid var(--secondary);
  border-radius: var(--radius);
  padding: 20px; margin-bottom: 20px;
  backdrop-filter: blur(5px);
}

label {
  display: block; font-size: 0.85rem; color: var(--accent);
  margin-bottom: 8px; font-weight: 600;
}

input[type="text"], input[type="tel"] {
  width: 100%; padding: 12px; border-radius: 8px;
  border: 1px solid var(--glass); background: rgba(255,255,255,0.05);
  color: #fff; font-size: 1rem; outline: none;
}
input:focus { border-color: var(--secondary); }

.btn {
  border-radius: 8px; font-weight: 700; text-transform: uppercase;
  padding: 15px; border: none; cursor: pointer; width: 100%;
  font-size: 1rem; transition: 0.3s;
}
.btn-primary { background: var(--secondary); color: #fff; box-shadow: 0 4px 0 #b53b8c; }
.btn-primary:active { transform: translateY(2px); box-shadow: 0 2px 0 #b53b8c; }
.btn-outline { background: transparent; color: var(--accent); border: 2px solid var(--accent); }

.toggle-group { display: flex; gap: 8px; margin-bottom: 15px; }
.toggle-btn {
  flex: 1; text-align: center; padding: 10px;
  border-radius: 8px; border: 1px solid var(--glass);
  background: rgba(0,0,0,0.3); color: #ccc; cursor: pointer;
}
.toggle-btn.active { background: var(--accent-purple); color: #fff; border-color: #fff; }

/* Table Section */
.game-table {
  width: 100%; height: 320px;
  background: radial-gradient(circle, #2d1b4d 0%, #05010d 100%);
  border: 3px solid var(--accent-gold); border-radius: 160px;
  position: relative; margin: 20px 0;
  box-shadow: 0 0 20px rgba(255, 251, 150, 0.2);
}

.anime-char-mini {
  position: absolute; bottom: 10px; right: 10px;
  width: 120px; height: 120px;
  background-size: contain; background-repeat: no-repeat;
  opacity: 0.6; pointer-events: none;
}

.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
  background: var(--secondary); color: #fff; padding: 12px 25px; border-radius: 30px;
  z-index: 999; transition: 0.3s; opacity: 0; font-weight: 600;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0; }
.avatar-btn {
  aspect-ratio: 1; border: 2px solid var(--glass); border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer;
}
.avatar-btn.active { border-color: var(--secondary); background: rgba(255, 113, 206, 0.2); }
</style>
</head>
<body>
<div class="app-shell">
    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view active" style="padding: 0;">
        <div class="hero-box" id="mainHero">
            <div class="hero-overlay">
                <h1 class="logo-title">ริมหีโต๊ะไพ่</h1>
                <div style="color: var(--accent-gold); font-weight: 800; font-size: 0.7rem;">80S CLASSIC - ADULT COMEDY</div>
            </div>
        </div>

        <div style="padding: 20px;">
            <div class="panel">
                <label>ชื่อเล่นของคุณ</label>
                <input type="text" id="nickname" placeholder="ระบุชื่อเล่น..." maxlength="15">
                
                <label>เลือกตัวละคร</label>
                <div class="avatar-grid">
                    <div class="avatar-btn active" data-avatar="🌸">🌸</div>
                    <div class="avatar-btn" data-avatar="🎀">🎀</div>
                    <div class="avatar-btn" data-avatar="🍭">🍭</div>
                    <div class="avatar-btn" data-avatar="👒">👒</div>
                </div>
            </div>

            <div class="panel">
                <label>ประเภทเกม</label>
                <div class="toggle-group" id="gameGroup">
                    <div class="toggle-btn active" data-value="pokdeng">ป๊อกเด้ง</div>
                    <div class="toggle-btn" data-value="mix10">ผสมสิบ</div>
                </div>
                
                <label>ราคาเดิมพัน</label>
                <input type="tel" id="betAmount" value="50" style="text-align: center; font-weight: 800; color: var(--accent-gold);">
            </div>

            <button class="btn btn-primary" id="startBtn">✨ เข้าสู่โลก 80S</button>
        </div>
    </div>

    <!-- VIEW: LOBBY -->
    <div id="view-lobby" class="view">
        <div class="panel" style="text-align: center;">
            <h2 style="color: var(--secondary);">🏠 ห้องนั่งเล่น</h2>
            <div id="roomInfo" style="font-size: 1.2rem; margin: 10px 0; color: var(--accent);">ROOM: ------</div>
            <div id="playerList" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;"></div>
        </div>
        <button class="btn btn-primary" id="playNowBtn">🎮 เริ่มเกม!</button>
    </div>

    <!-- VIEW: GAME -->
    <div id="view-game" class="view">
        <div class="game-table">
            <div id="tableChar" class="anime-char-mini"></div>
            <div style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-weight:900; color:var(--glass); font-size:3rem;">80S</div>
        </div>
        <div class="panel" id="gameControls">
            <div id="statusText" style="text-align: center; margin-bottom: 10px; color: var(--accent-gold);">รอแจกไพ่...</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-outline" style="flex:1;">🃏 จั่ว</button>
                <button class="btn btn-primary" style="flex:1;">✋ อยู่</button>
            </div>
        </div>
    </div>
</div>

// Set Images
document.getElementById('mainHero').style.backgroundImage = `url(${imgHero})`;
document.getElementById('tableChar').style.backgroundImage = `url(${imgChar})`;

const App = {
    selectedAvatar: "🌸",
    init: function() {
        this.bindEvents();
    },
    showView: function(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + name).classList.add('active');
    },
    showToast: function(msg) {
        const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
        document.body.appendChild(t); setTimeout(() => t.classList.add("show"), 50);
        setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 500); }, 2500);
    },
    bindEvents: function() {
        document.querySelectorAll('.avatar-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.avatar-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.selectedAvatar = btn.dataset.avatar;
            };
        });

        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.onclick = () => {
                btn.parentElement.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            };
        });

        document.getElementById('startBtn').onclick = () => {
            const nick = document.getElementById('nickname').value.trim();
            if(!nick) return this.showToast("ใส่ชื่อก่อนนะจ๊ะ!");
            this.showView('lobby');
            document.getElementById('roomInfo').textContent = "ROOM: " + Math.floor(100000 + Math.random()*900000);
            document.getElementById('playerList').innerHTML = `<div class="panel" style="margin:0;"><div style="font-size:2rem;">${this.selectedAvatar}</div><div>${nick}</div></div>`;
        };

        document.getElementById('playNowBtn').onclick = () => {
            this.showView('game');
            this.showToast("เริ่มเกมแล้วจ้า!");
        };
    }
};

document.addEventListener("DOMContentLoaded", () => App.init());
</script>
