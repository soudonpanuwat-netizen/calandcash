<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>ริมหีโต๊ะไพ่ - ULTIMATE 80s EDITION</title>
<meta name="theme-color" content="#ff71ce" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&family=Playfair+Display:wght@700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --primary: #2d1b4d;
  --secondary: #ff71ce;
  --accent: #01cdfe;
  --accent-gold: #fffb96;
  --accent-purple: #b967ff;
  --accent-green: #39ff14;
  --bg-dark: #05010d;
  --text-light: #ffffff;
  --glass: rgba(255, 255, 255, 0.1);
  --glass-dark: rgba(0, 0, 0, 0.5);
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

body {
  margin: 0; padding: 0; height: 100%;
  background-color: var(--bg-dark);
  color: var(--text-light);
  font-family: 'Mitr', sans-serif;
  overflow-x: hidden;
  user-select: none;
  background-image: 
    linear-gradient(rgba(45, 27, 77, 0.8), rgba(5, 1, 13, 0.9)),
    linear-gradient(var(--glass) 1px, transparent 1px),
    linear-gradient(90deg, var(--glass) 1px, transparent 1px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
  position: relative;
}

/* CRT Scanline Effect (รายการที่ 1) */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15),
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Floating Suit Particles (รายการที่ 21) */
.particle-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.particle {
  position: absolute;
  font-size: 2rem;
  opacity: 0.3;
  animation: float 20s infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
}

.app-shell {
  max-width: 500px; margin: 0 auto; min-height: 100vh;
  position: relative;
  background: rgba(5, 1, 13, 0.7);
  border-left: 1px solid var(--secondary);
  border-right: 1px solid var(--secondary);
  z-index: 10;
}

.hidden { display: none !important; }
.view { display: none; padding: 20px; animation: fadeIn 0.5s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Neon Glow Animations (รายการที่ 3) */
@keyframes neonBreathe {
  0%, 100% { box-shadow: 0 0 10px var(--secondary), inset 0 0 10px rgba(255, 113, 206, 0.3); }
  50% { box-shadow: 0 0 20px var(--secondary), inset 0 0 20px rgba(255, 113, 206, 0.5); }
}

.hero-box {
  width: 100%; height: 200px;
  background-size: cover; background-position: center;
  border-radius: 0 0 var(--radius) var(--radius);
  border-bottom: 4px solid var(--secondary);
  position: relative; margin-bottom: 15px;
  animation: neonBreathe 3s infinite;
}

.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(transparent, var(--bg-dark));
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 15px; text-align: center;
}

.logo-title {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem; font-weight: 900; margin: 0;
  color: #fff;
  text-shadow: 3px 3px 0 var(--secondary), -1px -1px 0 var(--accent);
  letter-spacing: 2px;
}

/* Retro Digital Clock (รายการที่ 8) */
.digital-clock {
  position: absolute;
  top: 10px; left: 10px;
  font-family: 'Orbitron', monospace;
  font-size: 0.8rem;
  color: var(--accent-green);
  text-shadow: 0 0 10px var(--accent-green);
  letter-spacing: 2px;
}

/* Top Bar with Stats (รายการที่ 36 - XP System) */
.top-bar {
  background: var(--glass-dark);
  border-bottom: 2px solid var(--accent);
  padding: 10px 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  border-radius: 8px;
  animation: neonBreathe 4s infinite;
}

.stat-item {
  font-size: 0.75rem;
  color: var(--accent-gold);
  text-shadow: 0 0 5px var(--accent-gold);
}

.xp-bar {
  width: 80px;
  height: 4px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--accent-green);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 2px;
}

.xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-green), var(--accent-gold));
  width: 45%;
  transition: width 0.3s ease;
}

.panel {
  background: var(--glass-dark);
  border: 2px solid var(--secondary);
  border-radius: var(--radius);
  padding: 15px; margin-bottom: 15px;
  backdrop-filter: blur(5px);
  transition: all 0.3s ease;
}

.panel:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.3);
}

label { display: block; font-size: 0.8rem; color: var(--accent); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

input {
  width: 100%; padding: 12px; border-radius: 8px;
  border: 1px solid var(--glass); background: rgba(255,255,255,0.05);
  color: #fff; font-size: 1rem; outline: none; margin-bottom: 10px;
  transition: all 0.3s ease;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(1, 205, 254, 0.5);
  background: rgba(255,255,255,0.1);
}

.btn {
  border-radius: 8px; font-weight: 700; text-transform: uppercase;
  padding: 12px; border: none; cursor: pointer; width: 100%;
  font-size: 1rem; transition: 0.3s; margin-bottom: 10px;
  letter-spacing: 1px;
  font-family: 'Orbitron', monospace;
}

.btn-primary { 
  background: var(--secondary); 
  color: #fff; 
  box-shadow: 0 4px 0 #b53b8c, 0 0 15px rgba(255, 113, 206, 0.5);
}

.btn-primary:active {
  transform: translateY(4px);
  box-shadow: 0 0 15px rgba(255, 113, 206, 0.5);
}

.btn-outline { 
  background: transparent; 
  color: var(--accent); 
  border: 2px solid var(--accent);
  box-shadow: inset 0 0 10px rgba(1, 205, 254, 0.2);
}

.btn-outline:hover {
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5), inset 0 0 10px rgba(1, 205, 254, 0.2);
}

/* Avatar Selection (รายการที่ 5) */
.avatar-selector {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.avatar-option {
  width: 40px;
  height: 40px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  transition: all 0.3s ease;
}

.avatar-option:hover {
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5);
  transform: scale(1.1);
}

.avatar-option.selected {
  border-color: var(--accent-gold);
  box-shadow: 0 0 20px rgba(255, 251, 150, 0.8);
}

/* Game Table with Players */
.game-table {
  width: 100%; height: 300px;
  background: radial-gradient(circle, #2d1b4d 0%, #05010d 100%);
  border: 3px solid var(--accent-gold);
  border-radius: 150px;
  position: relative;
  margin: 20px 0;
  animation: neonBreathe 5s infinite;
  box-shadow: inset 0 0 30px rgba(255, 251, 150, 0.2);
}

/* Interactive Table Ripple (รายการที่ 22) */
.ripple {
  position: absolute;
  border: 2px solid var(--accent-gold);
  border-radius: 50%;
  animation: rippleEffect 0.6s ease-out;
}

@keyframes rippleEffect {
  0% { width: 0; height: 0; opacity: 1; }
  100% { width: 200px; height: 200px; opacity: 0; }
}

.player-spot {
  position: absolute; width: 70px; text-align: center;
}

.spot-top { top: -10px; left: 50%; transform: translateX(-50%); }
.spot-left { top: 50%; left: -10px; transform: translateY(-50%); }
.spot-right { top: 50%; right: -10px; transform: translateY(-50%); }
.spot-bottom { bottom: -10px; left: 50%; transform: translateX(-50%); }

/* Player Status Indicators (รายการที่ 23) */
.player-status {
  font-size: 0.5rem;
  color: var(--accent-green);
  text-shadow: 0 0 5px var(--accent-green);
  margin-top: 2px;
  height: 10px;
  min-height: 10px;
}

.card-area {
  display: flex; justify-content: center; gap: 5px; margin-top: 5px;
}

.card {
  width: 30px; height: 45px; background: #fff; border-radius: 4px;
  color: #000; font-weight: bold; font-size: 0.8rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
  animation: cardFlip 0.6s ease;
}

@keyframes cardFlip {
  0% { transform: rotateY(90deg); }
  100% { transform: rotateY(0deg); }
}

.card.back { background: var(--secondary); border: 1px solid #fff; color: #fff; }

/* God Mode Button */
#godBtn {
  position: absolute; top: 10px; right: 10px;
  width: 30px; height: 30px; background: transparent;
  border: none; cursor: pointer; opacity: 0.1; z-index: 100;
  display: none;
  font-size: 1.5rem;
  transition: all 0.3s ease;
}

#godBtn.active { 
  opacity: 1; 
  color: var(--accent-gold); 
  text-shadow: 0 0 10px gold;
  animation: godPulse 1s infinite;
}

@keyframes godPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

/* God Mode Pulse Radar (รายการที่ 27) */
.god-radar {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border: 2px solid var(--accent-gold);
  border-radius: 50%;
  opacity: 0;
  animation: radarSweep 3s infinite;
}

@keyframes radarSweep {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  50% { opacity: 0.5; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
}

.special-win {
  color: var(--accent-gold); font-weight: 900; animation: blink 0.5s infinite;
  font-size: 1.2rem;
  text-shadow: 0 0 10px var(--accent-gold);
}

@keyframes blink { 50% { opacity: 0.5; } }

/* Settings Menu (รายการที่ 29) */
.settings-menu {
  position: fixed;
  right: -300px;
  top: 0;
  width: 300px;
  height: 100vh;
  background: var(--glass-dark);
  border-left: 2px solid var(--secondary);
  backdrop-filter: blur(10px);
  padding: 20px;
  transition: right 0.3s ease;
  z-index: 1000;
  overflow-y: auto;
}

.settings-menu.active {
  right: 0;
}

.settings-close {
  position: absolute;
  top: 10px;
  right: 10px;
  background: none;
  border: none;
  color: var(--secondary);
  font-size: 1.5rem;
  cursor: pointer;
}

.settings-item {
  margin-bottom: 20px;
  border-bottom: 1px solid var(--glass);
  padding-bottom: 15px;
}

.settings-item label {
  margin-bottom: 10px;
}

.toggle-switch {
  width: 50px;
  height: 24px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--accent);
  border-radius: 12px;
  cursor: pointer;
  position: relative;
  transition: all 0.3s ease;
}

.toggle-switch.active {
  background: var(--accent-green);
}

.toggle-switch::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  background: #fff;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: left 0.3s ease;
}

.toggle-switch.active::after {
  left: 28px;
}

/* Achievement Badges (รายการที่ 31) */
.achievements-panel {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 10px;
}

.achievement-badge {
  width: 60px;
  height: 60px;
  background: rgba(0, 0, 0, 0.5);
  border: 2px solid var(--glass);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}

.achievement-badge:hover {
  border-color: var(--accent-gold);
  box-shadow: 0 0 15px rgba(255, 251, 150, 0.5);
}

.achievement-badge.locked {
  opacity: 0.3;
  filter: grayscale(100%);
}

.achievement-badge.unlocked {
  border-color: var(--accent-gold);
  box-shadow: 0 0 15px rgba(255, 251, 150, 0.8);
  animation: achievementPop 0.5s ease;
}

@keyframes achievementPop {
  0% { transform: scale(0); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* Win Confetti (รายการที่ 28) */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 999;
  animation: confettiFall 3s ease-out forwards;
}

@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(300px) rotate(720deg); }
}

/* Screen Shake (รายการที่ 35) */
@keyframes screenShake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-5px, -5px); }
  50% { transform: translate(5px, 5px); }
  75% { transform: translate(-5px, 5px); }
}

.shake {
  animation: screenShake 0.3s ease;
}

/* Glitch Effect (รายการที่ 4) */
@keyframes glitch {
  0% { clip-path: inset(40% 0 61% 0); transform: translate(0); }
  20% { clip-path: inset(92% 0 1% 0); transform: translate(-2px, 2px); }
  40% { clip-path: inset(43% 0 1% 0); transform: translate(-2px, -2px); }
  60% { clip-path: inset(25% 0 58% 0); transform: translate(2px, -2px); }
  80% { clip-path: inset(54% 0 7% 0); transform: translate(2px, 2px); }
  100% { clip-path: inset(58% 0 43% 0); transform: translate(0); }
}

.glitch {
  animation: glitch 0.3s ease;
}

/* Settings Button */
.settings-btn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  background: var(--secondary);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
  box-shadow: 0 4px 0 #b53b8c;
  transition: all 0.3s ease;
  z-index: 100;
}

.settings-btn:hover {
  box-shadow: 0 0 20px rgba(255, 113, 206, 0.8);
}

.settings-btn:active {
  transform: translateY(4px);
  box-shadow: 0 0 20px rgba(255, 113, 206, 0.8);
}

/* Language Toggle (รายการที่ 32) */
.lang-toggle {
  display: flex;
  gap: 5px;
  margin-bottom: 10px;
}

.lang-btn {
  flex: 1;
  padding: 8px;
  border: 1px solid var(--accent);
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  border-radius: 4px;
  font-size: 0.8rem;
  transition: all 0.3s ease;
}

.lang-btn.active {
  background: var(--accent);
  color: #000;
}

/* Leaderboard (รายการที่ 13) */
.leaderboard {
  background: var(--glass-dark);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 10px;
  margin-top: 10px;
}

.leaderboard-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px;
  border-bottom: 1px solid var(--glass);
  font-size: 0.8rem;
}

.leaderboard-item:last-child {
  border-bottom: none;
}

.leaderboard-rank {
  color: var(--accent-gold);
  font-weight: bold;
  min-width: 20px;
}

.leaderboard-name {
  flex: 1;
  margin-left: 10px;
  color: var(--text-light);
}

.leaderboard-score {
  color: var(--accent-green);
  font-weight: bold;
}

/* Animated Avatars (รายการที่ 37) */
.avatar-display {
  font-size: 2rem;
  animation: avatarBounce 0.5s ease;
}

@keyframes avatarBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.avatar-display.sad {
  animation: avatarSad 0.5s ease;
}

@keyframes avatarSad {
  0%, 100% { transform: scaleY(1); }
  50% { transform: scaleY(0.8); }
}

/* Neon Color Cycle (รายการที่ 26) */
@keyframes colorCycle {
  0% { filter: hue-rotate(0deg); }
  100% { filter: hue-rotate(360deg); }
}

.color-cycle {
  animation: colorCycle 20s linear infinite;
}

/* Cyberpunk Typography (รายการที่ 34) */
.cyberpunk-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.2rem;
  font-weight: 900;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent-gold);
  text-shadow: 0 0 10px var(--accent-gold), 2px 2px 0 var(--secondary);
}

/* Chips Display (รายการที่ 6) */
.chips-display {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 10px;
}

.chip {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: conic-gradient(var(--accent-gold), var(--secondary), var(--accent-gold));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: bold;
  color: #000;
  box-shadow: 0 0 10px rgba(255, 251, 150, 0.5);
}

.chips-amount {
  color: var(--accent-gold);
  font-weight: bold;
  text-shadow: 0 0 5px var(--accent-gold);
}

/* Responsive */
@media (max-width: 480px) {
  .app-shell {
    max-width: 100%;
    border-left: none;
    border-right: none;
  }
  
  .settings-menu {
    width: 250px;
  }
}
</style>
</head>
<body>
<div class="particle-container" id="particleContainer"></div>

<div class="app-shell">
    <div class="digital-clock" id="digitalClock">00:00</div>
    
    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view active" style="padding: 0;">
        <div class="hero-box" id="mainHero">
            <div class="hero-overlay">
                <h1 class="logo-title">ริมหีโต๊ะไพ่</h1>
                <div style="color: var(--accent-gold); font-weight: 800; font-size: 0.7rem;">ULTIMATE 80s EDITION 🔞</div>
            </div>
        </div>
        <div style="padding: 15px;">
            <div class="top-bar">
                <div class="stat-item">
                    <div>LEVEL: <span id="playerLevel">1</span></div>
                    <div class="xp-bar"><div class="xp-fill"></div></div>
                </div>
                <div class="stat-item">
                    <div>WIN STREAK: <span id="winStreak" style="color: var(--accent-green);">0</span></div>
                </div>
            </div>

            <div class="panel">
                <label>ชื่อเล่น</label>
                <input type="text" id="nickname" placeholder="ระบุชื่อ...">
                
                <label>เลือก Avatar</label>
                <div class="avatar-selector" id="avatarSelector"></div>
                
                <label>เบอร์พร้อมเพย์</label>
                <input type="tel" id="promptpay" placeholder="08x-xxx-xxxx">
            </div>

            <div class="panel">
                <label>ภาษา / Language</label>
                <div class="lang-toggle">
                    <button class="lang-btn active" data-lang="th">ไทย</button>
                    <button class="lang-btn" data-lang="en">English</button>
                </div>
            </div>

            <button class="btn btn-primary" id="createBtn">✨ สร้างโต๊ะ</button>
            <button class="btn btn-outline" id="joinBtn">🤝 จอยห้อง</button>
        </div>
    </div>

    <!-- VIEW: GAME -->
    <div id="view-game" class="view">
        <button id="godBtn" title="GOD MODE">👁️</button>
        <div class="god-radar" id="godRadar"></div>
        
        <div class="top-bar">
            <div class="stat-item">
                <div>💰 CHIPS: <span id="chipsAmount">1000</span></div>
            </div>
            <div class="stat-item">
                <div>⚡ LEVEL: <span id="gameLevelDisplay">1</span></div>
            </div>
            <div class="stat-item">
                <div>🏆 WIN: <span id="gameWinStreak">0</span></div>
            </div>
        </div>

        <div class="game-table" id="gameTable">
            <!-- Player spots -->
            <div class="player-spot spot-top">
                <div style="font-size:1.5rem;" class="avatar-display">👩‍🦰</div>
                <div style="font-size:0.6rem;">บีบี</div>
                <div class="player-status" id="status-top">พร้อม</div>
                <div class="card-area" id="cards-top">
                    <div class="card back">?</div>
                    <div class="card back">?</div>
                </div>
            </div>
            <div class="player-spot spot-left">
                <div style="font-size:1.5rem;" class="avatar-display">👩</div>
                <div style="font-size:0.6rem;">แอนนี่</div>
                <div class="player-status" id="status-left">พร้อม</div>
                <div class="card-area" id="cards-left">

document.getElementById('mainHero').style.backgroundImage = `url(${imgHero})`;

// Avatars (รายการที่ 5)
const avatars = ['🌸', '👨‍🎤', '🧙‍♂️', '🤖', '👽', '🎭', '🦄', '🐉'];

// Achievements (รายการที่ 31)
const achievements = [
  { id: 'first_win', emoji: '🏆', name: 'First Win', unlocked: false },
  { id: 'streak_5', emoji: '⚡', name: 'Streak x5', unlocked: false },
  { id: 'high_roller', emoji: '💰', name: 'High Roller', unlocked: false },
  { id: 'god_mode', emoji: '👁️', name: 'God Mode', unlocked: false },
  { id: 'level_10', emoji: '📈', name: 'Level 10', unlocked: false },
  { id: 'perfect_game', emoji: '✨', name: 'Perfect', unlocked: false },
];

const App = {
    isGodMode: false,
    playerLevel: 1,
    playerXP: 0,
    playerChips: 1000,
    winStreak: 0,
    selectedAvatar: '🌸',
    language: 'th',
    sfxEnabled: true,
    bgmEnabled: false,
    hapticEnabled: true,
    colorCycleEnabled: false,
    gameLog: [],
    leaderboard: [],

    init: function() {
        this.setupParticles();
        this.setupAvatarSelector();
        this.setupAchievements();
        this.bindEvents();
        this.updateClock();
        this.loadLocalData();
        setInterval(() => this.updateClock(), 1000);
    },

    setupParticles: function() {
        const container = document.getElementById('particleContainer');
        const suits = ['♠', '♥', '♦', '♣'];
        for(let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = suits[Math.floor(Math.random() * suits.length)];
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            container.appendChild(particle);
        }
    },

    setupAvatarSelector: function() {
        const selector = document.getElementById('avatarSelector');
        avatars.forEach(avatar => {
            const btn = document.createElement('div');
            btn.className = 'avatar-option' + (avatar === this.selectedAvatar ? ' selected' : '');
            btn.textContent = avatar;
            btn.onclick = () => {
                document.querySelectorAll('.avatar-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                this.selectedAvatar = avatar;
            };
            selector.appendChild(btn);
        });
    },

    setupAchievements: function() {
        const panel = document.getElementById('achievementsPanel');
        achievements.forEach(ach => {
            const badge = document.createElement('div');
            badge.className = 'achievement-badge locked';
            badge.textContent = ach.emoji;
            badge.title = ach.name;
            panel.appendChild(badge);
        });
    },

    updateClock: function() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('digitalClock').textContent = `${hours}:${minutes}`;
    },

    loadLocalData: function() {
        const saved = localStorage.getItem('rimheeGameData');
        if(saved) {
            const data = JSON.parse(saved);
            this.playerLevel = data.level || 1;
            this.playerXP = data.xp || 0;
            this.playerChips = data.chips || 1000;
            this.winStreak = data.winStreak || 0;
            this.leaderboard = data.leaderboard || [];
            this.updateLeaderboard();
        }
    },

    saveLocalData: function() {
        const data = {
            level: this.playerLevel,
            xp: this.playerXP,
            chips: this.playerChips,
            winStreak: this.winStreak,
            leaderboard: this.leaderboard
        };
        localStorage.setItem('rimheeGameData', JSON.stringify(data));
    },

    showView: function(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + name).classList.add('active');
    },

    bindEvents: function() {
        // Settings
        document.getElementById('settingsOpenBtn').onclick = () => {
            document.getElementById('settingsMenu').classList.add('active');
        };
        document.getElementById('settingsClose').onclick = () => {
            document.getElementById('settingsMenu').classList.remove('active');
        };

        // Toggles
        document.getElementById('sfxToggle').onclick = function() {
            this.classList.toggle('active');
            App.sfxEnabled = this.classList.contains('active');
        };
        document.getElementById('bgmToggle').onclick = function() {
            this.classList.toggle('active');
            App.bgmEnabled = this.classList.contains('active');
        };
        document.getElementById('hapticToggle').onclick = function() {
            this.classList.toggle('active');
            App.hapticEnabled = this.classList.contains('active');
        };
        document.getElementById('colorCycleToggle').onclick = function() {
            this.classList.toggle('active');
            App.colorCycleEnabled = this.classList.contains('active');
            if(App.colorCycleEnabled) {
                document.body.classList.add('color-cycle');
            } else {
                document.body.classList.remove('color-cycle');
            }
        };

        // Language
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.language = btn.dataset.lang;
            };
        });

        // Game
        document.getElementById('createBtn').onclick = () => {
            const nick = document.getElementById('nickname').value;
            const promptpay = document.getElementById('promptpay').value.replace(/-/g, '').trim();
            
            if(!nick) return alert("ใส่ชื่อก่อน!");
            
            if(promptpay === "0822199910") {
                document.getElementById('godBtn').style.display = "block";
            } else {
                document.getElementById('godBtn').style.display = "none";
            }

            document.getElementById('myName').textContent = nick;
            document.getElementById('myAvatar').textContent = this.selectedAvatar;
            this.showView('game');
            this.checkSpecialHand();
            this.playSound('draw');
        };

        document.getElementById('godBtn').onclick = () => {
            this.isGodMode = !this.isGodMode;
            document.getElementById('godBtn').classList.toggle('active');
            this.triggerGlitch();
            this.toggleGodCards();
            this.playSound('god_mode');
        };

        document.getElementById('gameTable').onclick = (e) => {
            if(e.target === document.getElementById('gameTable')) {
                this.createRipple(e);
            }
        };

        document.getElementById('drawBtn').onclick = () => {
            this.drawCard();
        };

        document.getElementById('stayBtn').onclick = () => {
            this.stayCard();
        };
    },

    createRipple: function(e) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = (e.offsetX - 100) + 'px';
        ripple.style.top = (e.offsetY - 100) + 'px';
        document.getElementById('gameTable').appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    },

    triggerGlitch: function() {
        const godRadar = document.getElementById('godRadar');
        godRadar.style.display = 'block';
        setTimeout(() => godRadar.style.display = 'none', 1000);
        document.body.classList.add('glitch');
        setTimeout(() => document.body.classList.remove('glitch'), 300);
    },

    toggleGodCards: function() {
        const spots = ['top', 'left', 'right'];
        const fakeCards = {
            top: ['K♥', 'Q♥'],
            left: ['J♠', '10♠'],
            right: ['2♣', '5♦']
        };

        spots.forEach(spot => {
            const area = document.getElementById('cards-' + spot);
            if(this.isGodMode) {
                area.innerHTML = fakeCards[spot].map(c => `<div class="card" style="color:${c.includes('♥')||c.includes('♦')?'red':'black'}">${c}</div>`).join('');
            } else {
                area.innerHTML = `<div class="card back">?</div><div class="card back">?</div>`;
            }
        });
    },

    drawCard: function() {
        this.playSound('draw');
        this.screenShake();
        this.addGameLog('จั่วไพ่');
        this.gainXP(10);
    },

    stayCard: function() {
        this.playSound('stay');
        this.addGameLog('อยู่');
        this.checkWin();
    },

    checkWin: function() {
        const rand = Math.random();
        if(rand > 0.5) {
            this.winStreak++;
            this.playerChips += 100;
            this.gainXP(50);
            this.createConfetti();
            this.screenShake();
            this.playSound('win');
            this.addGameLog('ชนะ! +100 chips');
            this.checkAchievements();
        } else {
            this.winStreak = 0;
            this.playerChips -= 50;
            this.playSound('lose');
            this.addGameLog('แพ้ -50 chips');
        }
        this.saveLocalData();
        this.updateUI();
    },

    checkSpecialHand: function() {
        const types = ["", "ป๊อก 9 สองเด้ง!", "ตองพระเจ้า!", "เรียงอังกฤษ (เซียน)!", "ผสมสิบเรียง!"];
        const rand = Math.floor(Math.random() * types.length);
        if(rand > 0) {
            document.getElementById('winType').textContent = types[rand];
            document.getElementById('statusText').textContent = "ชนะแน่นอนจ้า!";
        }
    },

    gainXP: function(amount) {
        this.playerXP += amount;
        if(this.playerXP >= 100) {
            this.playerLevel++;
            this.playerXP = 0;
            this.playSound('levelup');
            this.createConfetti();
        }
        this.updateUI();
    },

    createConfetti: function() {
        for(let i = 0; i < 30; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.textContent = ['🎉', '✨', '🎊', '⭐'][Math.floor(Math.random() * 4)];
            confetti.style.left = Math.random() * window.innerWidth + 'px';
            confetti.style.top = '0px';
            confetti.style.background = ['#ff71ce', '#01cdfe', '#fffb96', '#39ff14'][Math.floor(Math.random() * 4)];
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3000);
        }
    },

    screenShake: function() {
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 300);
    },

    playSound: function(type) {
        if(!this.sfxEnabled) return;
        // Placeholder for sound effects
        console.log('Sound:', type);
    },

    addGameLog: function(action) {
        const time = new Date().toLocaleTimeString();
        this.gameLog.push(`${time} - ${action}`);
        if(this.gameLog.length > 20) this.gameLog.shift();
        this.updateGameLog();
    },

    updateGameLog: function() {
        const log = document.getElementById('gameLog');
        log.innerHTML = this.gameLog.map(entry => `<div>${entry}</div>`).join('');
        log.scrollTop = log.scrollHeight;
    },

    checkAchievements: function() {
        if(this.winStreak === 1) this.unlockAchievement('first_win');
        if(this.winStreak >= 5) this.unlockAchievement('streak_5');
        if(this.playerChips >= 5000) this.unlockAchievement('high_roller');
        if(this.isGodMode) this.unlockAchievement('god_mode');
        if(this.playerLevel >= 10) this.unlockAchievement('level_10');
    },

    unlockAchievement: function(id) {
        const ach = achievements.find(a => a.id === id);
        if(ach && !ach.unlocked) {
            ach.unlocked = true;
            const badges = document.querySelectorAll('.achievement-badge');
            badges.forEach((badge, idx) => {
                if(achievements[idx].id === id) {
                    badge.classList.remove('locked');
                    badge.classList.add('unlocked');
                }
            });
        }
    },

    updateLeaderboard: function() {
        const lb = document.getElementById('leaderboard');
        const sorted = this.leaderboard.sort((a, b) => b.score - a.score).slice(0, 5);
        lb.innerHTML = sorted.map((entry, idx) => 
            `<div class="leaderboard-item">
                <span class="leaderboard-rank">#${idx + 1}</span>
                <span class="leaderboard-name">${entry.name}</span>
                <span class="leaderboard-score">${entry.score}</span>
            </div>`
        ).join('');
    },

    updateUI: function() {
        document.getElementById('playerLevel').textContent = this.playerLevel;
        document.getElementById('gameLevelDisplay').textContent = this.playerLevel;
        document.getElementById('winStreak').textContent = this.winStreak;
        document.getElementById('gameWinStreak').textContent = this.winStreak;
        document.getElementById('chipsAmount').textContent = this.playerChips;
        document.querySelector('.xp-fill').style.width = (this.playerXP) + '%';
    }
};

document.addEventListener("DOMContentLoaded", () => App.init());
</script>
</body>
</html>
