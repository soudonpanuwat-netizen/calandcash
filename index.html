<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>ริมหีโต๊ะไพ่ - ULTIMATE 80s EDITION</title>
<meta name="theme-color" content="#ff71ce" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&family=Playfair+Display:wght@700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
:root {
  --primary: #2d1b4d;
  --secondary: #ff71ce;
  --accent: #01cdfe;
  --accent-gold: #fffb96;
  --accent-purple: #b967ff;
  --accent-green: #39ff14;
  --bg-dark: #05010d;
  --text-light: #ffffff;
  --glass: rgba(255, 255, 255, 0.1);
  --glass-dark: rgba(0, 0, 0, 0.5);
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

body {
  margin: 0; padding: 0; height: 100%;
  background-color: var(--bg-dark);
  color: var(--text-light);
  font-family: 'Mitr', sans-serif;
  overflow-x: hidden;
  user-select: none;
  background-image: 
    linear-gradient(rgba(45, 27, 77, 0.8), rgba(5, 1, 13, 0.9)),
    linear-gradient(var(--glass) 1px, transparent 1px),
    linear-gradient(90deg, var(--glass) 1px, transparent 1px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15),
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 9999;
}

.particle-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.particle {
  position: absolute;
  font-size: 2rem;
  opacity: 0.3;
  animation: float 20s infinite;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
  10% { opacity: 0.3; }
  90% { opacity: 0.3; }
  100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
}

.app-shell {
  max-width: 500px; margin: 0 auto; min-height: 100vh;
  position: relative;
  background: rgba(5, 1, 13, 0.7);
  border-left: 1px solid var(--secondary);
  border-right: 1px solid var(--secondary);
  z-index: 10;
}

.hidden { display: none !important; }
.view { display: none; padding: 15px; animation: fadeIn 0.5s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@keyframes neonBreathe {
  0%, 100% { box-shadow: 0 0 10px var(--secondary), inset 0 0 10px rgba(255, 113, 206, 0.3); }
  50% { box-shadow: 0 0 20px var(--secondary), inset 0 0 20px rgba(255, 113, 206, 0.5); }
}

.hero-box {
  width: 100%; height: 150px;
  background-size: cover; background-position: center;
  border-radius: 0 0 var(--radius) var(--radius);
  border-bottom: 4px solid var(--secondary);
  position: relative; margin-bottom: 15px;
  animation: neonBreathe 3s infinite;
}

.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(transparent, var(--bg-dark));
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 15px; text-align: center;
}

.logo-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem; font-weight: 900; margin: 0;
  color: #fff;
  text-shadow: 3px 3px 0 var(--secondary), -1px -1px 0 var(--accent);
  letter-spacing: 2px;
}

.digital-clock {
  position: absolute;
  top: 10px; left: 10px;
  font-family: 'Orbitron', monospace;
  font-size: 0.75rem;
  color: var(--accent-green);
  text-shadow: 0 0 10px var(--accent-green);
  letter-spacing: 2px;
}

.top-bar {
  background: var(--glass-dark);
  border-bottom: 2px solid var(--accent);
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  border-radius: 8px;
  animation: neonBreathe 4s infinite;
  font-size: 0.75rem;
}

.stat-item {
  color: var(--accent-gold);
  text-shadow: 0 0 5px var(--accent-gold);
}

.xp-bar {
  width: 60px;
  height: 3px;
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--accent-green);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 2px;
}

.xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-green), var(--accent-gold));
  width: 45%;
  transition: width 0.3s ease;
}

.panel {
  background: var(--glass-dark);
  border: 2px solid var(--secondary);
  border-radius: var(--radius);
  padding: 12px; margin-bottom: 12px;
  backdrop-filter: blur(5px);
  transition: all 0.3s ease;
}

.panel:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.3);
}

label { display: block; font-size: 0.75rem; color: var(--accent); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

input {
  width: 100%; padding: 10px; border-radius: 8px;
  border: 1px solid var(--glass); background: rgba(255,255,255,0.05);
  color: #fff; font-size: 0.9rem; outline: none; margin-bottom: 10px;
  transition: all 0.3s ease;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(1, 205, 254, 0.5);
  background: rgba(255,255,255,0.1);
}

.btn {
  border-radius: 8px; font-weight: 700; text-transform: uppercase;
  padding: 10px; border: none; cursor: pointer; width: 100%;
  font-size: 0.9rem; transition: 0.3s; margin-bottom: 10px;
  letter-spacing: 1px;
  font-family: 'Orbitron', monospace;
}

.btn-primary { 
  background: var(--secondary); 
  color: #fff; 
  box-shadow: 0 4px 0 #b53b8c, 0 0 15px rgba(255, 113, 206, 0.5);
}

.btn-primary:active {
  transform: translateY(4px);
  box-shadow: 0 0 15px rgba(255, 113, 206, 0.5);
}

.btn-outline { 
  background: transparent; 
  color: var(--accent); 
  border: 2px solid var(--accent);
  box-shadow: inset 0 0 10px rgba(1, 205, 254, 0.2);
  font-size: 0.8rem;
}

.btn-outline:hover {
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5), inset 0 0 10px rgba(1, 205, 254, 0.2);
}

.avatar-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.avatar-option {
  width: 35px;
  height: 35px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  transition: all 0.3s ease;
}

.avatar-option:hover {
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5);
  transform: scale(1.1);
}

.avatar-option.selected {
  border-color: var(--accent-gold);
  box-shadow: 0 0 20px rgba(255, 251, 150, 0.8);
}

.game-table {
  width: 100%; height: 280px;
  background: radial-gradient(circle, #2d1b4d 0%, #05010d 100%);
  border: 3px solid var(--accent-gold);
  border-radius: 150px;
  position: relative;
  margin: 15px 0;
  animation: neonBreathe 5s infinite;
  box-shadow: inset 0 0 30px rgba(255, 251, 150, 0.2);
}

.ripple {
  position: absolute;
  border: 2px solid var(--accent-gold);
  border-radius: 50%;
  animation: rippleEffect 0.6s ease-out;
}

@keyframes rippleEffect {
  0% { width: 0; height: 0; opacity: 1; }
  100% { width: 200px; height: 200px; opacity: 0; }
}

.player-spot {
  position: absolute; width: 65px; text-align: center; font-size: 0.7rem;
}

.spot-top { top: -5px; left: 50%; transform: translateX(-50%); }
.spot-left { top: 50%; left: -5px; transform: translateY(-50%); }
.spot-right { top: 50%; right: -5px; transform: translateY(-50%); }
.spot-bottom { bottom: -5px; left: 50%; transform: translateX(-50%); }

.player-status {
  font-size: 0.5rem;
  color: var(--accent-green);
  text-shadow: 0 0 5px var(--accent-green);
  margin-top: 2px;
  height: 8px;
  min-height: 8px;
}

.card-area {
  display: flex; justify-content: center; gap: 4px; margin-top: 3px;
}

.card {
  width: 25px; height: 38px; background: #fff; border-radius: 3px;
  color: #000; font-weight: bold; font-size: 0.7rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
  animation: cardFlip 0.6s ease;
}

@keyframes cardFlip {
  0% { transform: rotateY(90deg); }
  100% { transform: rotateY(0deg); }
}

.card.back { background: var(--secondary); border: 1px solid #fff; color: #fff; }

.card.god-mode-visible {
  background: linear-gradient(135deg, rgba(57, 255, 20, 0.3), rgba(1, 205, 254, 0.3));
  border: 2px solid var(--accent-green);
  color: var(--accent-green);
  text-shadow: 0 0 5px var(--accent-green);
  font-weight: bold;
}

#godBtn {
  position: absolute; top: 10px; right: 10px;
  width: 30px; height: 30px; background: transparent;
  border: none; cursor: pointer; opacity: 0.1; z-index: 100;
  display: none;
  font-size: 1.5rem;
  transition: all 0.3s ease;
}

#godBtn.active { 
  opacity: 1; 
  color: var(--accent-gold); 
  text-shadow: 0 0 10px gold;
  animation: godPulse 1s infinite;
}

@keyframes godPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.god-radar {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  border: 2px solid var(--accent-gold);
  border-radius: 50%;
  opacity: 0;
  animation: radarSweep 3s infinite;
}

@keyframes radarSweep {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
  50% { opacity: 0.5; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
}

.special-win {
  color: var(--accent-gold); font-weight: 900; animation: blink 0.5s infinite;
  font-size: 1rem;
  text-shadow: 0 0 10px var(--accent-gold);
}

@keyframes blink { 50% { opacity: 0.5; } }

.bet-control {
  background: var(--glass-dark);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
}

.bet-slider {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.5);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  margin: 10px 0;
}

.bet-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent-gold);
  cursor: pointer;
  box-shadow: 0 0 10px var(--accent-gold);
}

.bet-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent-gold);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 10px var(--accent-gold);
}

.bet-display {
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin: 10px 0;
  padding: 10px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  border: 1px solid var(--accent-gold);
}

.bet-amount {
  color: var(--accent-gold);
  font-weight: bold;
  text-shadow: 0 0 5px var(--accent-gold);
  font-size: 1.2rem;
}

.multiplier-badge {
  background: var(--accent-green);
  color: #000;
  padding: 5px 10px;
  border-radius: 5px;
  font-weight: bold;
  font-size: 0.85rem;
}

.bot-manager {
  background: var(--glass-dark);
  border: 2px solid var(--accent-purple);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
}

.bot-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.bot-item {
  background: rgba(185, 103, 255, 0.2);
  border: 1px solid var(--accent-purple);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 0.8rem;
}

.bot-remove-btn {
  background: #ff4444;
  border: none;
  color: #fff;
  border-radius: 50%;
  width: 20px;
  height: 20px;
  cursor: pointer;
  font-size: 0.7rem;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s ease;
}

.bot-remove-btn:hover {
  background: #ff0000;
  box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
}

.bot-add-btn {
  width: 100%;
  background: transparent;
  border: 2px dashed var(--accent-purple);
  color: var(--accent-purple);
  padding: 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  transition: all 0.3s ease;
}

.bot-add-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 0 10px rgba(185, 103, 255, 0.5);
}

.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  pointer-events: none;
  z-index: 999;
  animation: confettiFall 3s ease-out forwards;
}

@keyframes confettiFall {
  0% { opacity: 1; transform: translateY(0) rotate(0deg); }
  100% { opacity: 0; transform: translateY(300px) rotate(720deg); }
}

@keyframes screenShake {
  0%, 100% { transform: translate(0, 0); }
  25% { transform: translate(-5px, -5px); }
  50% { transform: translate(5px, 5px); }
  75% { transform: translate(-5px, 5px); }
}

.shake {
  animation: screenShake 0.3s ease;
}

/* God Control Panel */
.god-control-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0,0,0,0.95);
  border: 3px solid var(--accent-gold);
  border-radius: 16px;
  padding: 20px;
  z-index: 2000;
  max-width: 90%;
  box-shadow: 0 0 30px var(--accent-gold);
  display: none;
}

.god-control-panel.active {
  display: block;
}

.god-control-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.5rem;
  color: var(--accent-gold);
  text-shadow: 0 0 10px var(--accent-gold);
  margin-bottom: 10px;
  text-align: center;
}

.god-control-subtitle {
  color: var(--accent);
  font-size: 0.9rem;
  text-align: center;
  margin-bottom: 15px;
}

.god-control-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 15px;
}

.god-result-btn {
  padding: 12px;
  border: none;
  border-radius: 8px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 0.9rem;
}

.god-result-btn:hover {
  transform: scale(1.05);
}

.god-result-btn.normal { background: var(--secondary); }
.god-result-btn.seian { background: var(--accent-green); color: #000; }
.god-result-btn.tong { background: var(--accent-purple); }
.god-result-btn.noi { background: var(--accent); color: #000; }

.god-control-close {
  width: 100%;
  padding: 10px;
  background: rgba(255,255,255,0.2);
  border: 2px solid var(--accent);
  border-radius: 8px;
  color: var(--accent);
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.god-control-close:hover {
  background: rgba(255,255,255,0.3);
}

/* Summary Panel */
.summary-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1999;
  backdrop-filter: blur(5px);
  display: none;
}

.summary-overlay.active {
  display: block;
}

.summary-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(5,1,13,0.95);
  border: 3px solid var(--accent-gold);
  border-radius: 16px;
  padding: 20px;
  z-index: 2000;
  max-width: 95%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 0 30px var(--accent-gold);
  display: none;
}

.summary-panel.active {
  display: block;
}

.summary-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.3rem;
  color: var(--accent-gold);
  text-shadow: 0 0 10px var(--accent-gold);
  text-align: center;
  margin-bottom: 15px;
}

.summary-table {
  width: 100%;
  border-collapse: collapse;
  color: var(--accent-gold);
  font-size: 0.85rem;
  margin-bottom: 15px;
}

.summary-table th {
  padding: 10px;
  text-align: left;
  border-bottom: 2px solid var(--accent-gold);
  background: rgba(255, 251, 150, 0.1);
}

.summary-table td {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.summary-table .net-positive {
  color: var(--accent-green);
  font-weight: bold;
}

.summary-table .net-negative {
  color: var(--secondary);
  font-weight: bold;
}

.summary-close-btn {
  width: 100%;
  padding: 12px;
  background: var(--secondary);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.summary-close-btn:hover {
  box-shadow: 0 0 15px rgba(255, 113, 206, 0.5);
}

@media (max-width: 480px) {
  .app-shell {
    max-width: 100%;
    border-left: none;
    border-right: none;
  }
  
  .panel {
    padding: 10px;
    margin-bottom: 10px;
  }
  
  .btn {
    padding: 9px;
    font-size: 0.8rem;
    margin-bottom: 8px;
  }

  .god-control-panel {
    max-width: 95%;
  }

  .summary-panel {
    max-width: 95%;
  }
}
</style>
</head>
<body>
<div class="particle-container" id="particleContainer"></div>

<div class="app-shell">
    <div class="digital-clock" id="digitalClock">00:00</div>
    
    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view active" style="padding: 0;">
        <div class="hero-box" id="mainHero">
            <div class="hero-overlay">
                <h1 class="logo-title">ริมหีโต๊ะไพ่</h1>
                <div style="color: var(--accent-gold); font-weight: 800; font-size: 0.65rem;">ULTIMATE 80s EDITION 🔞</div>
            </div>
        </div>
        <div style="padding: 12px;">
            <div class="top-bar">
                <div class="stat-item">
                    <div>LV: <span id="playerLevel">1</span></div>
                    <div class="xp-bar"><div class="xp-fill"></div></div>
                </div>
                <div class="stat-item">
                    <div>WIN: <span id="winStreak" style="color: var(--accent-green);">0</span></div>
                </div>
            </div>

            <div class="panel">
                <label>ชื่อเล่น</label>
                <input type="text" id="nickname" placeholder="ระบุชื่อ...">
                
                <label>เลือก Avatar</label>
                <div class="avatar-selector" id="avatarSelector"></div>
                
                <label>เบอร์พร้อมเพย์</label>
                <input type="tel" id="promptpay" placeholder="08x-xxx-xxxx">
            </div>

            <button class="btn btn-primary" id="createBtn">✨ สร้างโต๊ะ</button>
            <button class="btn btn-outline" id="joinBtn">🤝 จอยห้อง</button>
        </div>
    </div>

    <!-- VIEW: GAME -->
    <div id="view-game" class="view">
        <button id="godBtn" title="GOD MODE">👁️</button>
        <div class="god-radar" id="godRadar"></div>
        
        <!-- GOD MODE CONTROL PANEL -->
        <div class="god-control-panel" id="godControlPanel">
            <div class="god-control-title">⚡ GOD MODE ⚡</div>
            <div class="god-control-subtitle">เลือกผลลัพธ์ที่ต้องการ</div>
            <div class="god-control-buttons">
                <button class="god-result-btn normal" onclick="App.setGodResult('normal')">🎯 ชนะปกติ</button>
                <button class="god-result-btn seian" onclick="App.setGodResult('seian')">📊 เรียงอังกฤษ</button>
                <button class="god-result-btn tong" onclick="App.setGodResult('tong')">👑 ตองพระเจ้า</button>
                <button class="god-result-btn noi" onclick="App.setGodResult('noi')">🎪 ป๊อก 9</button>
            </div>
            <button class="god-control-close" onclick="App.closeGodPanel()">ปิด</button>
        </div>

        <!-- FINANCIAL SUMMARY OVERLAY -->
        <div class="summary-overlay" id="summaryOverlay"></div>
        <div class="summary-panel" id="summaryPanel">
            <div class="summary-title">💰 สรุปยอดเงิน 💰</div>
            <table class="summary-table" id="summaryTable"></table>
            <button class="summary-close-btn" onclick="App.closeSummary()">ตกลง</button>
        </div>
        
        <div class="top-bar">
            <div class="stat-item">

document.getElementById('mainHero').style.backgroundImage = `url(${imgHero})`;

const avatars = ['🌸', '👨‍🎤', '🧙‍♂️', '🤖', '👽', '🎭', '🦄', '🐉'];
const botNames = ['🎭 บีบี', '🎭 แอนนี่', '🎭 น้องส้ม'];
const botIds = ['bebe', 'annie', 'som'];

const App = {
    isGodMode: false,
    godResult: null,
    playerLevel: 1,
    playerXP: 0,
    playerChips: 1000,
    winStreak: 0,
    selectedAvatar: '🌸',
    currentBet: 1,
    multiplier: 1,
    betInRound: 0,
    activeBots: ['bebe', 'annie', 'som'],

    init: function() {
        this.setupParticles();
        this.setupAvatarSelector();
        this.bindEvents();
        this.updateClock();
        this.loadLocalData();
        setInterval(() => this.updateClock(), 1000);
    },

    setupParticles: function() {
        const container = document.getElementById('particleContainer');
        const suits = ['♠', '♥', '♦', '♣'];
        for(let i = 0; i < 15; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = suits[Math.floor(Math.random() * suits.length)];
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 20 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            container.appendChild(particle);
        }
    },

    setupAvatarSelector: function() {
        const selector = document.getElementById('avatarSelector');
        avatars.forEach(avatar => {
            const btn = document.createElement('div');
            btn.className = 'avatar-option' + (avatar === this.selectedAvatar ? ' selected' : '');
            btn.textContent = avatar;
            btn.onclick = () => {
                document.querySelectorAll('.avatar-option').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                this.selectedAvatar = avatar;
            };
            selector.appendChild(btn);
        });
    },

    updateClock: function() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('digitalClock').textContent = `${hours}:${minutes}`;
    },

    loadLocalData: function() {
        const saved = localStorage.getItem('rimheeGameData');
        if(saved) {
            const data = JSON.parse(saved);
            this.playerLevel = data.level || 1;
            this.playerXP = data.xp || 0;
            this.playerChips = data.chips || 1000;
            this.winStreak = data.winStreak || 0;
        }
    },

    saveLocalData: function() {
        const data = {
            level: this.playerLevel,
            xp: this.playerXP,
            chips: this.playerChips,
            winStreak: this.winStreak
        };
        localStorage.setItem('rimheeGameData', JSON.stringify(data));
    },

    showView: function(name) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + name).classList.add('active');
    },

    bindEvents: function() {
        document.getElementById('createBtn').onclick = () => {
            const nick = document.getElementById('nickname').value;
            const promptpay = document.getElementById('promptpay').value.replace(/-/g, '').trim();
            
            if(!nick) return alert("ใส่ชื่อก่อน!");
            
            if(promptpay === "0822199910") {
                document.getElementById('godBtn').style.display = "block";
            } else {
                document.getElementById('godBtn').style.display = "none";
            }

            document.getElementById('myName').textContent = nick;
            document.getElementById('myAvatar').textContent = this.selectedAvatar;
            this.showView('game');
            this.checkSpecialHand();
        };

        document.getElementById('godBtn').onclick = () => {
            if(!this.isGodMode) {
                document.getElementById('godControlPanel').classList.add('active');
            } else {
                this.isGodMode = false;
                this.godResult = null;
                document.getElementById('godBtn').classList.remove('active');
                this.toggleGodCards();
            }
        };

        document.getElementById('betSlider').oninput = (e) => {
            this.currentBet = parseInt(e.target.value);
            this.updateBetDisplay();
        };

        document.getElementById('doubleDownBtn').onclick = () => {
            if(this.currentBet * 2 <= 10) {
                this.currentBet *= 2;
                this.multiplier = 2;
                this.updateBetDisplay();
                document.getElementById('betSlider').value = this.currentBet;
            } else {
                alert('เดิมพันเกินขีดจำกัด!');
            }
        };

        document.getElementById('resetBetBtn').onclick = () => {
            this.currentBet = 1;
            this.multiplier = 1;
            this.updateBetDisplay();
            document.getElementById('betSlider').value = 1;
        };

        document.getElementById('addBotBtn').onclick = () => {
            const newBotNames = ['🎮 ปิดหมา', '🎲 เจ้าพนัน', '🃏 ดีลเลอร์', '🎪 โจ๊กเกอร์'];
            const botName = newBotNames[Math.floor(Math.random() * newBotNames.length)];
            const botId = 'bot_' + Date.now();
            this.activeBots.push(botId);
            this.updateBotList();
        };

        document.getElementById('drawBtn').onclick = () => {
            this.drawCard();
        };

        document.getElementById('stayBtn').onclick = () => {
            this.stayCard();
        };

        document.getElementById('gameTable').onclick = (e) => {
            if(e.target === document.getElementById('gameTable')) {
                this.createRipple(e);
            }
        };
    },

    updateBetDisplay: function() {
        document.getElementById('betAmount').textContent = this.currentBet + ' ฿';
        document.getElementById('multiplierBadge').textContent = 'x' + this.multiplier;
    },

    updateBotList: function() {
        const botList = document.getElementById('botList');
        botList.innerHTML = this.activeBots.map((botId, idx) => 
            `<div class="bot-item">
                <span>${botNames[idx % botNames.length]}</span>
                <button class="bot-remove-btn" onclick="App.removeBot('${botId}')">✕</button>
            </div>`
        ).join('');
    },

    removeBot: function(botId) {
        this.activeBots = this.activeBots.filter(id => id !== botId);
        this.updateBotList();
    },

    createRipple: function(e) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        ripple.style.left = (e.offsetX - 100) + 'px';
        ripple.style.top = (e.offsetY - 100) + 'px';
        document.getElementById('gameTable').appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    },

    triggerGlitch: function() {
        const godRadar = document.getElementById('godRadar');
        godRadar.style.display = 'block';
        setTimeout(() => godRadar.style.display = 'none', 1000);
    },

    toggleGodCards: function() {
        const spots = ['top', 'left', 'right'];
        const fakeCards = {
            top: ['K♥', 'Q♥'],
            left: ['J♠', '10♠'],
            right: ['2♣', '5♦']
        };

        spots.forEach(spot => {
            const area = document.getElementById('cards-' + spot);
            if(this.isGodMode) {
                area.innerHTML = fakeCards[spot].map(c => 
                    `<div class="card god-mode-visible">${c}</div>`
                ).join('');
            } else {
                area.innerHTML = `<div class="card back">?</div><div class="card back">?</div>`;
            }
        });
    },

    setGodResult: function(result) {
        this.godResult = result;
        this.isGodMode = true;
        document.getElementById('godBtn').classList.add('active');
        this.triggerGlitch();
        this.toggleGodCards();
        document.getElementById('godControlPanel').classList.remove('active');
    },

    closeGodPanel: function() {
        document.getElementById('godControlPanel').classList.remove('active');
    },

    drawCard: function() {
        if(!this.betInRound) {
            this.betInRound = this.currentBet;
            this.playerChips -= this.currentBet;
            this.updateUI();
        }
        this.screenShake();
    },

    stayCard: function() {
        if(!this.betInRound) {
            this.betInRound = this.currentBet;
            this.playerChips -= this.currentBet;
            this.updateUI();
        }
        this.checkWin();
    },

    checkWin: function() {
        this.showSummary();
    },

    showSummary: function() {
        const summary = this.calculateSummary();
        const summaryTable = document.getElementById('summaryTable');
        
        let html = '<tr>';
        html += '<th>ผู้เล่น</th>';
        html += '<th style="text-align: center;">ได้</th>';
        html += '<th style="text-align: center;">เสีย</th>';
        html += '<th style="text-align: right;">สุทธิ</th>';
        html += '</tr>';
        
        summary.forEach(row => {
            const netClass = row.net > 0 ? 'net-positive' : 'net-negative';
            html += `<tr>`;
            html += `<td>${row.name}</td>`;
            html += `<td style="text-align: center; color: var(--accent-green);">${row.win}</td>`;
            html += `<td style="text-align: center; color: var(--secondary);">${row.lose}</td>`;
            html += `<td style="text-align: right;" class="${netClass}">${row.net > 0 ? '+' : ''}${row.net}</td>`;
            html += `</tr>`;
        });
        
        summaryTable.innerHTML = html;
        
        document.getElementById('summaryOverlay').classList.add('active');
        document.getElementById('summaryPanel').classList.add('active');
    },

    calculateSummary: function() {
        const players = [
            { name: '🎭 บีบี', id: 'bebe' },
            { name: '🎭 แอนนี่', id: 'annie' },
            { name: '🎭 น้องส้ม', id: 'som' },
            { name: document.getElementById('myName').textContent + ' (YOU)', id: 'player' }
        ];
        
        const baseAmount = this.betInRound * this.multiplier;
        const summary = [];
        
        players.forEach(player => {
            let win = 0, lose = 0;
            
            if(player.id === 'player') {
                if(Math.random() > 0.5) {
                    win = baseAmount * 2;
                } else {
                    lose = baseAmount;
                }
            } else {
                if(Math.random() > 0.5) {
                    lose = baseAmount;
                } else {
                    win = baseAmount * 2;
                }
            }
            
            summary.push({
                name: player.name,
                win: win,
                lose: lose,
                net: win - lose
            });
        });
        
        return summary;
    },

    closeSummary: function() {
        document.getElementById('summaryOverlay').classList.remove('active');
        document.getElementById('summaryPanel').classList.remove('active');
        this.resetBetting();
        this.isGodMode = false;
        this.godResult = null;
        document.getElementById('godBtn').classList.remove('active');
        this.toggleGodCards();
    },

    checkSpecialHand: function() {
        const types = ["", "ป๊อก 9 สองเด้ง!", "ตองพระเจ้า!", "เรียงอังกฤษ!", "ผสมสิบเรียง!"];
        const rand = Math.floor(Math.random() * types.length);
        if(rand > 0) {
            document.getElementById('winType').textContent = types[rand];
            document.getElementById('statusText').textContent = "ชนะแน่นอน!";
        }
    },

    gainXP: function(amount) {
        this.playerXP += amount;
        if(this.playerXP >= 100) {
            this.playerLevel++;
            this.playerXP = 0;
        }
        this.updateUI();
    },

    createConfetti: function() {
        for(let i = 0; i < 20; i++) {
            const confetti = document.createElement('div');
            confetti.className = 'confetti';
            confetti.textContent = ['🎉', '✨', '🎊'][Math.floor(Math.random() * 3)];
            confetti.style.left = Math.random() * window.innerWidth + 'px';
            confetti.style.top = '0px';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 3000);
        }
    },

    screenShake: function() {
        document.body.classList.add('shake');
        setTimeout(() => document.body.classList.remove('shake'), 300);
    },

    resetBetting: function() {
        this.currentBet = 1;
        this.multiplier = 1;
        this.betInRound = 0;
        this.updateBetDisplay();
        document.getElementById('betSlider').value = 1;
    },

    updateUI: function() {
        document.getElementById('playerLevel').textContent = this.playerLevel;
        document.getElementById('gameLevelDisplay').textContent = this.playerLevel;
        document.getElementById('winStreak').textContent = this.winStreak;
        document.getElementById('gameWinStreak').textContent = this.winStreak;
        document.getElementById('chipsAmount').textContent = this.playerChips;
        document.querySelector('.xp-fill').style.width = (this.playerXP) + '%';
    }
};

document.addEventListener("DOMContentLoaded", () => App.init());
</script>
</body>
</html>
