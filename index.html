<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>ริมหีโต๊ะไพ่ - ULTIMATE AUDIO v6 (Supabase + Sound)</title>
<meta name="theme-color" content="#ff71ce" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;600&family=Playfair+Display:wght@700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #2d1b4d;
  --secondary: #ff71ce;
  --accent: #01cdfe;
  --accent-gold: #fffb96;
  --accent-purple: #b967ff;
  --accent-green: #39ff14;
  --bg-dark: #05010d;
  --text-light: #ffffff;
  --glass: rgba(255, 255, 255, 0.1);
  --glass-dark: rgba(0, 0, 0, 0.5);
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background-color: var(--bg-dark);
  color: var(--text-light);
  font-family: 'Mitr', sans-serif;
  overflow-x: hidden;
  user-select: none;
}

body {
  background-image: 
    linear-gradient(rgba(45, 27, 77, 0.8), rgba(5, 1, 13, 0.9)),
    linear-gradient(var(--glass) 1px, transparent 1px),
    linear-gradient(90deg, var(--glass) 1px, transparent 1px);
  background-size: 100% 100%, 40px 40px, 40px 40px;
  position: relative;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.15),
    rgba(0, 0, 0, 0.15) 1px,
    transparent 1px,
    transparent 2px
  );
  pointer-events: none;
  z-index: 9999;
}

@keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.3; } 90% { opacity: 0.3; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }
@keyframes neonBreathe { 0%, 100% { box-shadow: 0 0 10px var(--secondary), inset 0 0 10px rgba(255, 113, 206, 0.3); } 50% { box-shadow: 0 0 20px var(--secondary), inset 0 0 20px rgba(255, 113, 206, 0.5); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes cardDealArc { 0% { transform: translateX(-180px) translateY(-180px) rotateZ(-90deg) scale(0.1); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateX(0) translateY(0) rotateZ(0deg) scale(1); opacity: 1; } }
@keyframes cardFlip3D { 0% { transform: rotateY(90deg) rotateX(0deg); } 50% { transform: rotateY(45deg) rotateX(5deg); } 100% { transform: rotateY(0deg) rotateX(0deg); } }
@keyframes cardGlow { 0%, 100% { box-shadow: 0 0 10px rgba(255, 251, 150, 0.5); } 50% { box-shadow: 0 0 25px rgba(255, 251, 150, 1); } }
@keyframes screenShake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-8px, -8px); } 50% { transform: translate(8px, 8px); } 75% { transform: translate(-8px, 8px); } }
@keyframes shuffle { 0%, 100% { transform: rotateZ(0deg); } 25% { transform: rotateZ(-8deg); } 75% { transform: rotateZ(8deg); } }
@keyframes playerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
@keyframes playerGlow { 0%, 100% { text-shadow: 0 0 5px var(--accent-green); } 50% { text-shadow: 0 0 15px var(--accent-green); } }
@keyframes tablePulse { 0%, 100% { box-shadow: inset 0 0 20px rgba(255, 251, 150, 0.2); } 50% { box-shadow: inset 0 0 40px rgba(255, 251, 150, 0.5); } }
@keyframes summarySlideIn { 0% { transform: translate(-50%, -60%); opacity: 0; } 100% { transform: translate(-50%, -50%); opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
@keyframes slideIn { 0% { transform: translateX(-100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
@keyframes textGlow { 0%, 100% { text-shadow: 0 0 5px var(--accent); } 50% { text-shadow: 0 0 15px var(--accent); } }
@keyframes borderGlow { 0%, 100% { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); } 50% { border-color: var(--accent-gold); box-shadow: 0 0 20px var(--accent-gold); } }
@keyframes neonFlicker { 0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { text-shadow: 0 0 10px var(--accent-gold); } 20%, 24%, 55% { text-shadow: 0 0 5px var(--accent-gold); } }

.particle-container {
  position: fixed;
  top: 0; left: 0;
  width: 100%;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.particle {
  position: absolute;
  font-size: 2rem;
  opacity: 0.3;
  animation: float 20s infinite;
}

.app-shell {
  max-width: 500px; margin: 0 auto; min-height: 100vh;
  position: relative;
  background: rgba(5, 1, 13, 0.7);
  border-left: 1px solid var(--secondary);
  border-right: 1px solid var(--secondary);
  z-index: 10;
}

.view { display: none; padding: 15px; animation: fadeIn 0.5s ease; }
.view.active { display: block; }

.hero-box {
  width: 100%; height: 150px;
  background: linear-gradient(135deg, #2d1b4d, #4a2a6b);
  border-radius: 0 0 var(--radius) var(--radius);
  border-bottom: 4px solid var(--secondary);
  position: relative; margin-bottom: 15px;
  animation: neonBreathe 3s infinite;
}

.hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(transparent, var(--bg-dark));
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 15px; text-align: center;
}

.logo-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem; font-weight: 900; margin: 0;
  color: #fff;
  text-shadow: 3px 3px 0 var(--secondary), -1px -1px 0 var(--accent);
  letter-spacing: 2px;
  animation: neonFlicker 3s infinite;
}

.digital-clock {
  position: absolute;
  top: 10px; left: 10px;
  font-family: 'Orbitron', monospace;
  font-size: 0.75rem;
  color: var(--accent-green);
  text-shadow: 0 0 10px var(--accent-green);
  letter-spacing: 2px;
  animation: textGlow 2s infinite;
}

.room-badge {
  position: absolute;
  top: 10px; right: 10px;
  font-family: 'Orbitron', monospace;
  font-size: 0.7rem;
  color: var(--accent);
  background: rgba(1, 205, 254, 0.2);
  border: 1px solid var(--accent);
  padding: 4px 8px;
  border-radius: 4px;
  text-shadow: 0 0 5px var(--accent);
  animation: borderGlow 2s infinite;
}

.audio-control {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 2000;
  background: var(--glass-dark);
  border: 2px solid var(--accent);
  border-radius: 50%;
  width: 50px;
  height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.5rem;
  transition: all 0.3s ease;
  animation: pulse 2s infinite;
}

.audio-control:hover {
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5);
  transform: scale(1.1);
}

.audio-control.muted {
  opacity: 0.5;
}

.top-bar {
  background: var(--glass-dark);
  border-bottom: 2px solid var(--accent);
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  border-radius: 8px;
  animation: neonBreathe 4s infinite;
  font-size: 0.75rem;
}

.stat-item {
  color: var(--accent-gold);
  text-shadow: 0 0 5px var(--accent-gold);
  animation: playerPulse 3s infinite;
}

.panel {
  background: var(--glass-dark);
  border: 2px solid var(--secondary);
  border-radius: var(--radius);
  padding: 12px; margin-bottom: 12px;
  backdrop-filter: blur(5px);
  transition: all 0.3s ease;
  animation: slideIn 0.5s ease;
}

.panel:hover {
  border-color: var(--accent);
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.3);
}

label { display: block; font-size: 0.75rem; color: var(--accent); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

input {
  width: 100%; padding: 10px; border-radius: 8px;
  border: 1px solid var(--glass); background: rgba(255,255,255,0.05);
  color: #fff; font-size: 0.9rem; outline: none; margin-bottom: 10px;
  transition: all 0.3s ease;
}

input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(1, 205, 254, 0.5);
  background: rgba(255,255,255,0.1);
}

.btn {
  border-radius: 8px; font-weight: 700; text-transform: uppercase;
  padding: 10px; border: none; cursor: pointer; width: 100%;
  font-size: 0.9rem; transition: 0.3s; margin-bottom: 10px;
  letter-spacing: 1px;
  font-family: 'Orbitron', monospace;
  position: relative;
  overflow: hidden;
}

.btn-primary { 
  background: var(--secondary); 
  color: #fff; 
  box-shadow: 0 4px 0 #b53b8c, 0 0 15px rgba(255, 113, 206, 0.5);
}

.btn-primary:hover {
  animation: cardGlow 0.6s infinite;
}

.btn-primary:active {
  transform: translateY(4px);
  box-shadow: 0 0 15px rgba(255, 113, 206, 0.5);
}

.btn-outline { 
  background: transparent; 
  color: var(--accent); 
  border: 2px solid var(--accent);
  box-shadow: inset 0 0 10px rgba(1, 205, 254, 0.2);
  font-size: 0.8rem;
}

.btn-outline:hover {
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5), inset 0 0 10px rgba(1, 205, 254, 0.2);
}

.avatar-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.avatar-option {
  width: 35px;
  height: 35px;
  border: 2px solid var(--accent);
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.3);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  transition: all 0.3s ease;
  animation: pulse 2s infinite;
}

.avatar-option:hover {
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5);
  transform: scale(1.1);
}

.avatar-option.selected {
  border-color: var(--accent-gold);
  box-shadow: 0 0 20px rgba(255, 251, 150, 0.8);
  animation: cardGlow 1s infinite;
}

.game-table {
  width: 100%; height: 360px;
  background: radial-gradient(circle, #2d1b4d 0%, #05010d 100%);
  border: 3px solid var(--accent-gold);
  border-radius: 150px;
  position: relative;
  margin: 15px 0;
  animation: tablePulse 3s infinite;
  box-shadow: inset 0 0 30px rgba(255, 251, 150, 0.2);
  overflow: hidden;
}

.game-table.shake {
  animation: screenShake 0.4s ease;
}

.player-spot {
  position: absolute; width: 80px; text-align: center; font-size: 0.7rem;
}

.spot-top { top: 5px; left: 50%; transform: translateX(-50%); }
.spot-left { top: 50%; left: 5px; transform: translateY(-50%); }
.spot-right { top: 50%; right: 5px; transform: translateY(-50%); }
.spot-bottom { bottom: 5px; left: 50%; transform: translateX(-50%); }

.player-name {
  animation: playerGlow 2s infinite;
}

.player-status {
  font-size: 0.5rem;
  color: var(--accent-green);
  text-shadow: 0 0 5px var(--accent-green);
  margin-top: 2px;
  height: 8px;
  min-height: 8px;
}

.card-area {
  display: flex; justify-content: center; gap: 2px; margin-top: 3px;
  flex-wrap: wrap;
  perspective: 1000px;
}

.card {
  width: 32px; height: 48px; background: #fff; border-radius: 4px;
  color: #000; font-weight: bold; font-size: 0.6rem;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 16px rgba(0,0,0,0.8);
  animation: cardDealArc 0.95s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  transform-style: preserve-3d;
  border: 1px solid #ddd;
  transition: all 0.2s ease;
  line-height: 1;
}

.card:nth-child(2) { animation-delay: 0.15s; }
.card:nth-child(3) { animation-delay: 0.30s; }
.card:nth-child(4) { animation-delay: 0.45s; }
.card:nth-child(5) { animation-delay: 0.60s; }

.card.back { 
  background: linear-gradient(135deg, #ff71ce, #b967ff);
  border: 2px solid var(--accent-gold);
  color: #fff;
  box-shadow: 0 8px 20px rgba(255, 113, 206, 0.6);
  font-weight: 900;
  animation: cardFlip3D 0.8s ease forwards;
}

.game-mode-selector {
  background: var(--glass-dark);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
  display: flex;
  gap: 8px;
  animation: slideIn 0.6s ease;
}

.mode-btn {
  flex: 1;
  padding: 10px;
  border: 2px solid var(--accent);
  background: transparent;
  color: var(--accent);
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  font-size: 0.8rem;
  transition: all 0.3s ease;
  animation: pulse 2s infinite;
}

.mode-btn.active {
  background: var(--accent);
  color: #000;
  box-shadow: 0 0 15px rgba(1, 205, 254, 0.5);
  animation: cardGlow 1s infinite;
}

.mode-btn:hover {
  box-shadow: 0 0 10px rgba(1, 205, 254, 0.3);
}

.bet-control {
  background: var(--glass-dark);
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 12px;
  animation: slideIn 0.7s ease;
}

.bet-slider {
  width: 100%;
  height: 6px;
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.5);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  margin: 10px 0;
}

.bet-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent-gold);
  cursor: pointer;
  box-shadow: 0 0 10px var(--accent-gold);
}

.bet-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent-gold);
  cursor: pointer;
  border: none;
  box-shadow: 0 0 10px var(--accent-gold);
}

.bet-display {
  display: flex;
  justify-content: space-around;
  align-items: center;
  margin: 10px 0;
  padding: 10px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 8px;
  border: 1px solid var(--accent-gold);
  animation: borderGlow 2s infinite;
}

.bet-amount {
  color: var(--accent-gold);
  font-weight: bold;
  text-shadow: 0 0 5px var(--accent-gold);
  font-size: 1.2rem;
  animation: textGlow 1s infinite;
}

.multiplier-badge {
  background: var(--accent-green);
  color: #000;
  padding: 5px 10px;
  border-radius: 5px;
  font-weight: bold;
  font-size: 0.8rem;
  animation: pulse 1s infinite;
}

.summary-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0,0,0,0.8);
  z-index: 1999;
  backdrop-filter: blur(5px);
  display: none;
  animation: fadeIn 0.3s ease;
}

.summary-overlay.active {
  display: block;
}

.summary-panel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(5,1,13,0.95);
  border: 3px solid var(--accent-gold);
  border-radius: 16px;
  padding: 20px;
  z-index: 2000;
  max-width: 95%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 0 30px var(--accent-gold);
  display: none;
  animation: summarySlideIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.summary-panel.active {
  display: block;
}

.summary-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.3rem;
  color: var(--accent-gold);
  text-shadow: 0 0 10px var(--accent-gold);
  text-align: center;
  margin-bottom: 15px;
  animation: neonFlicker 2s infinite;
}

.summary-table {
  width: 100%;
  border-collapse: collapse;
  color: var(--accent-gold);
  font-size: 0.85rem;
  margin-bottom: 15px;
}

.summary-table th {
  padding: 10px;
  text-align: left;
  border-bottom: 2px solid var(--accent-gold);
  background: rgba(255, 251, 150, 0.1);
  animation: textGlow 1s infinite;
}

.summary-table td {
  padding: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.summary-table .net-positive {
  color: var(--accent-green);
  font-weight: bold;
  animation: playerGlow 1s infinite;
}

.summary-table .net-negative {
  color: var(--secondary);
  font-weight: bold;
  animation: pulse 1s infinite;
}

.summary-close-btn {
  width: 100%;
  padding: 12px;
  background: var(--secondary);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
}

.summary-close-btn:hover {
  box-shadow: 0 0 15px rgba(255, 113, 206, 0.5);
}

.game-info {
  background: rgba(57, 255, 20, 0.1);
  border: 1px solid var(--accent-green);
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 12px;
  font-size: 0.8rem;
  color: var(--accent-green);
  line-height: 1.4;
  animation: slideIn 0.6s ease;
}

.status-text {
  color: var(--accent-gold);
  font-weight: bold;
  font-size: 0.8rem;
  animation: neonFlicker 1.5s infinite;
}

.loading-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid var(--accent);
  border-top-color: var(--accent-gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.error-message {
  background: rgba(255, 113, 206, 0.2);
  border: 1px solid var(--secondary);
  color: var(--secondary);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  font-size: 0.8rem;
}

.success-message {
  background: rgba(57, 255, 20, 0.2);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
  font-size: 0.8rem;
}

@media (max-width: 480px) {
  .app-shell {
    max-width: 100%;
    border-left: none;
    border-right: none;
  }
  
  .panel {
    padding: 10px;
    margin-bottom: 10px;
  }
  
  .btn {
    padding: 9px;
    font-size: 0.8rem;
    margin-bottom: 8px;
  }

  .summary-panel {
    max-width: 95%;
  }

  .game-table {
    height: 320px;
  }

  .card {
    width: 28px;
    height: 42px;
    font-size: 0.55rem;
  }
}
</style>
</head>
<body>
<div class="particle-container" id="particleContainer"></div>

<!-- Audio Control Button -->
<div class="audio-control" id="audioControl" title="🔊 Sound ON/OFF">🔊</div>

<div class="app-shell">
    <div class="digital-clock" id="digitalClock">00:00</div>
    
    <!-- VIEW: LOGIN -->
    <div id="view-login" class="view active" style="padding: 0;">
        <div class="hero-box" id="mainHero">
            <div class="hero-overlay">
                <h1 class="logo-title">ริมหีโต๊ะไพ่</h1>
                <div style="color: var(--accent-gold); font-weight: 800; font-size: 0.65rem;">ULTIMATE AUDIO v6 🔞 (Supabase + Sound)</div>
            </div>
        </div>
        <div style="padding: 12px;">
            <div class="top-bar">
                <div class="stat-item">
                    <div>LV: <span id="playerLevel">1</span></div>
                </div>
                <div class="stat-item">
                    <div>WIN: <span id="winStreak" style="color: var(--accent-green);">0</span></div>
                </div>
            </div>

            <div id="authMessage"></div>

            <div class="panel">
                <label>ชื่อเล่น</label>
                <input type="text" id="nickname" placeholder="ระบุชื่อ...">
                
                <label>เลือก Avatar</label>
                <div class="avatar-selector" id="avatarSelector"></div>
                
                <label>เบอร์พร้อมเพย์</label>
                <input type="tel" id="promptpay" placeholder="08x-xxx-xxxx">
            </div>

            <button class="btn btn-primary" id="createBtn">✨ สร้างโต๊ะ</button>
            
            <div class="panel">
                <label>หรือ เข้าห้องที่มีอยู่</label>
                <input type="text" id="joinRoomCode" placeholder="กรอกรหัสห้อง 4 หลัก" maxlength="4">
                <button class="btn btn-outline" id="joinBtn">🤝 จอยห้อง</button>
            </div>
        </div>
    </div>

    <!-- VIEW: GAME -->
    <div id="view-game" class="view">
        <div class="room-badge" id="roomBadge">ROOM #0000</div>
        
        <div class="top-bar">
            <div class="stat-item">
                💰 <span id="chipsAmount">1000</span>
            </div>
            <div class="stat-item">
                ⚡ LV: <span id="gameLevelDisplay">1</span>
            </div>
            <div class="stat-item">
                🏆 <span id="gameWinStreak">0</span>
            </div>
        </div>

        <!-- Game Mode Selector -->
        <div class="game-mode-selector">
            <button class="mode-btn active" onclick="App.setGameMode('mixed10')">ผสมสิบ</button>

<script>
// ===== SOUND ENGINE (Web Audio API) =====
class SoundEngine {
    constructor() {
        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        this.masterGain = this.audioContext.createGain();
        this.masterGain.connect(this.audioContext.destination);
        this.masterGain.gain.value = 0.3;
        this.isMuted = false;
    }

    // Synth Oscillator Sound
    playTone(frequency, duration, type = 'sine', volume = 0.3) {
        if (this.isMuted) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.type = type;
        osc.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, this.audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + duration);
        osc.start(this.audioContext.currentTime);
        osc.stop(this.audioContext.currentTime + duration);
    }

    // Card Dealing Sound (Whoosh)
    playCardDeal() {
        if (this.isMuted) return;
        const osc = this.audioContext.createOscillator();
        const gain = this.audioContext.createGain();
        const filter = this.audioContext.createBiquadFilter();
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterGain);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.audioContext.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, this.audioContext.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, this.audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.15);
        osc.start(this.audioContext.currentTime);
        osc.stop(this.audioContext.currentTime + 0.15);
    }

    // Card Flip Sound
    playCardFlip() {
        if (this.isMuted) return;
        this.playTone(400, 0.08, 'sine', 0.15);
        setTimeout(() => this.playTone(600, 0.08, 'sine', 0.15), 50);
    }

    // Card Landing Sound
    playCardLanding() {
        if (this.isMuted) return;
        this.playTone(300, 0.12, 'square', 0.2);
    }

    // Shuffle Sound
    playShuffle() {
        if (this.isMuted) return;
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                const freq = 200 + Math.random() * 300;
                this.playTone(freq, 0.05, 'triangle', 0.1);
            }, i * 30);
        }
    }

    // Button Click Sound
    playButtonClick() {
        if (this.isMuted) return;
        this.playTone(800, 0.05, 'sine', 0.15);
        setTimeout(() => this.playTone(1000, 0.05, 'sine', 0.15), 50);
    }

    // Hover Sound (Neon Hum)
    playHoverSound() {
        if (this.isMuted) return;
        this.playTone(600, 0.1, 'sine', 0.1);
    }

    // Win Sound (Fanfare)
    playWinSound() {
        if (this.isMuted) return;
        const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
        notes.forEach((freq, idx) => {
            setTimeout(() => this.playTone(freq, 0.3, 'sine', 0.25), idx * 150);
        });
    }

    // Lose Sound
    playLoseSound() {
        if (this.isMuted) return;
        this.playTone(400, 0.1, 'sine', 0.2);
        setTimeout(() => this.playTone(300, 0.2, 'sine', 0.2), 100);
        setTimeout(() => this.playTone(200, 0.3, 'sine', 0.2), 250);
    }

    // Jackpot Sound
    playJackpot() {
        if (this.isMuted) return;
        const frequencies = [523, 659, 784, 659, 784, 1047];
        frequencies.forEach((freq, idx) => {
            setTimeout(() => this.playTone(freq, 0.15, 'sine', 0.2), idx * 80);
        });
    }

    // Chip Clinking Sound
    playChipClink() {
        if (this.isMuted) return;
        this.playTone(1200, 0.08, 'sine', 0.15);
        setTimeout(() => this.playTone(1400, 0.08, 'sine', 0.15), 50);
    }

    // Level Up Sound
    playLevelUp() {
        if (this.isMuted) return;
        const notes = [523, 659, 784, 1047];
        notes.forEach((freq, idx) => {
            setTimeout(() => this.playTone(freq, 0.2, 'sine', 0.25), idx * 100);
        });
    }

    // Draw Card Sound
    playDrawCard() {
        if (this.isMuted) return;
        this.playCardDeal();
        setTimeout(() => this.playCardFlip(), 100);
    }

    // Glitch Sound
    playGlitch() {
        if (this.isMuted) return;
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                const freq = 100 + Math.random() * 400;
                this.playTone(freq, 0.05, 'square', 0.2);
            }, i * 40);
        }
    }

    // Error Sound
    playError() {
        if (this.isMuted) return;
        this.playTone(200, 0.1, 'sine', 0.2);
        setTimeout(() => this.playTone(150, 0.15, 'sine', 0.2), 100);
    }

    // Success Sound
    playSuccess() {
        if (this.isMuted) return;
        this.playTone(800, 0.1, 'sine', 0.2);
        setTimeout(() => this.playTone(1000, 0.1, 'sine', 0.2), 100);
    }

    // Notification Sound (Friend Joined)
    playNotification() {
        if (this.isMuted) return;
        this.playTone(1000, 0.15, 'sine', 0.2);
        setTimeout(() => this.playTone(1200, 0.15, 'sine', 0.2), 150);
    }

    // Bet Placed Sound
    playBetPlaced() {
        if (this.isMuted) return;
        this.playTone(600, 0.1, 'sine', 0.15);
        setTimeout(() => this.playTone(700, 0.1, 'sine', 0.15), 80);
    }

    // Multiplier Sound
    playMultiplier() {
        if (this.isMuted) return;
        const notes = [523, 784, 523, 784];
        notes.forEach((freq, idx) => {
            setTimeout(() => this.playTone(freq, 0.1, 'sine', 0.2), idx * 60);
        });
    }

    // Toggle Mute
    toggleMute() {
        this.isMuted = !this.isMuted;
        return this.isMuted;
    }
}

                    nickname: nick,

                    .eq('id', this.playerId);

            }

        location.reload();

    setupRealtimeSubscription: function(roomId) {
        if (this.realtimeSubscription) {
            this.realtimeSubscription.unsubscribe();
        }

        this.realtimeSubscription = supabase
            .channel(`room:${roomId}`)
            .on(
                'postgres_changes',
                { event: '*', schema: 'public', table: 'players', filter: `room_id=eq.${roomId}` },
                (payload) => {
                    console.log('Realtime update (players):', payload);
                    if (payload.eventType === 'INSERT') {
                        soundEngine.playNotification();
                    }
                    this.updatePlayersInRoom();
                }
            )
            .subscribe();

        console.log('✅ Realtime subscription active');
    },

                .from('players')

                            const card = document.createElement('div');
                            card.className = 'card back';
                            card.textContent = '?';
                            soundEngine.playCardDeal();
                            area.appendChild(card);
                        }
                    }
                }, idx * 350);
            });
        }, 700);
    },

    drawCard: function() {
        if(!this.betInRound) {
            this.betInRound = this.currentBet;
            this.playerChips -= this.currentBet;
            this.updateUI();
        }
        const gameTable = document.getElementById('gameTable');
        gameTable.classList.add('shake');
        setTimeout(() => gameTable.classList.remove('shake'), 400);
        document.getElementById('statusText').textContent = 'จั่วไพ่ใบที่ 3...';
    },

    stayCard: function() {
        if(!this.betInRound) {
            this.betInRound = this.currentBet;
            this.playerChips -= this.currentBet;
            this.updateUI();
        }
        this.checkWin();
    },

    checkWin: function() {
        this.winStreak++;
        this.playerChips += this.currentBet * 3;
        soundEngine.playWinSound();
        this.showSummary();
    },

    updateUI: function() {
        document.getElementById('chipsAmount').textContent = this.playerChips;
        document.getElementById('gameLevelDisplay').textContent = this.playerLevel;
        document.getElementById('gameWinStreak').textContent = this.winStreak;
    },

    showSummary: function() {
        const summary = [
            { name: 'YOU', win: this.currentBet * 2, lose: 0, net: this.currentBet },
            { name: 'บีบี', win: 0, lose: this.currentBet, net: -this.currentBet },
            { name: 'แอนนี่', win: 0, lose: this.currentBet, net: -this.currentBet },
            { name: 'น้องส้ม', win: 0, lose: this.currentBet, net: -this.currentBet }
        ];
        
        const summaryTable = document.getElementById('summaryTable');
        let html = '<tr>';
        html += '<th>ผู้เล่น</th>';
        html += '<th style="text-align: center;">ได้</th>';
        html += '<th style="text-align: center;">เสีย</th>';
        html += '<th style="text-align: right;">สุทธิ</th>';
        html += '</tr>';
        
        summary.forEach(row => {
            const netClass = row.net > 0 ? 'net-positive' : 'net-negative';
            html += `<tr>`;
            html += `<td>${row.name}</td>`;
            html += `<td style="text-align: center; color: var(--accent-green);">${row.win}</td>`;
            html += `<td style="text-align: center; color: var(--secondary);">${row.lose}</td>`;
            html += `<td style="text-align: right;" class="${netClass}">${row.net > 0 ? '+' : ''}${row.net}</td>`;
            html += `</tr>`;
        });
        
        summaryTable.innerHTML = html;
        document.getElementById('summaryOverlay').classList.add('active');
        document.getElementById('summaryPanel').classList.add('active');
    },

    closeSummary: function() {
        soundEngine.playButtonClick();
        document.getElementById('summaryOverlay').classList.remove('active');
        document.getElementById('summaryPanel').classList.remove('active');
        this.betInRound = 0;
        document.getElementById('statusText').textContent = 'รอกินรอบวง...';
        this.dealInitialCards();
    }
};

// Initialize
App.init();
</script>
</body>
</html>
